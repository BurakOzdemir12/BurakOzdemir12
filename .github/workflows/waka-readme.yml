name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repo so the action can read and modify README.md
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Run Waka Readme Stats Action
      - name: Update README with WakaTime / Wakapi Metrics
        uses: anmol098/waka-readme-stats@master
        with:
          # ==========================================
          # 1. AUTHENTICATION & API ENDPOINTS
          # ==========================================
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_API_URL: "https://wakapi.dev/api"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ==========================================
          # 2. TARGET SECTION & BRANCH SETTINGS
          # ==========================================
          SECTION_NAME: "waka"
          PULL_BRANCH_NAME: ""
          PUSH_BRANCH_NAME: ""

          # ==========================================
          # 3. METRICS VISIBILITY FLAGS
          # ==========================================
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_PROFILE_VIEWS: "False"       # Set to False to prevent conflicts with your existing visitor counter
          SHOW_LINES_OF_CODE: "True"
          SHOW_AI_CODE_TIME: "False"        # Wakapi does not support AI coding endpoints
          SHOW_AI_CODING: "False"           # Wakapi does not support AI coding endpoints
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "True"
          SHOW_UPDATED_DATE: "True"

          # ==========================================
          # 4. VISUAL STYLING & PROGRESS BAR OPTIONS
          # ==========================================
          LOCALE: "en"
          UPDATED_DATE_FORMAT: "%d/%m/%Y %H:%M:%S"
          BADGE_STYLE: "for-the-badge"
          BAR_STYLE: "text"
          SYMBOL_VERSION: "1"
          BAR_COLOR: "#61DAFB"
          BAR_TRACK_COLOR: "#172F45"
          BAR_RADIUS: "4"
          TEXT_PRIMARY_COLOR: "#c9d1d9"
          TEXT_SECONDARY_COLOR: "#8b949e"

          # ==========================================
          # 5. REPOSITORY FILTERING & GIT COMMIT CONFIG
          # ==========================================
          IGNORED_REPOS: ""
          MAX_REPOS: "0"
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "Updated with Dev Metrics [skip ci]"
          COMMIT_USERNAME: ""
          COMMIT_EMAIL: ""
          COMMIT_SINGLE: "False"
          FORCE_ADD: "False"
          DEBUG_LOGGING: "False"
